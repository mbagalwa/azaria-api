# Reverse-proxy Nginx pour l'API Azaria.
#
#   sudo cp deploy/nginx-azaria-api.conf /etc/nginx/sites-available/azaria-api
#   sudo ln -s /etc/nginx/sites-available/azaria-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.azaria.cd     # ajoute le 443 + redirection HTTPS
#
# Remplacer api.azaria.cd par ton (sous-)domaine.

server {
    listen 80;
    listen [::]:80;
    server_name api.azaria.cd;

    # Uploads d'images (Cloudinary passe par l'API) : autoriser des corps ~25 Mo.
    client_max_body_size 25m;

    # Flux temps réel (SSE / Transmit) : pas de buffering, connexion longue.
    location /__transmit/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
